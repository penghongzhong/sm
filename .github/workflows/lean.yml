name: K 5.11 pinned Lean 4.19 Bochner

on:
  push:
    branches:
      - lean-k511-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: false
      - name: Resolve pinned Mathlib
        run: lake update
      - name: Fetch Mathlib compiled cache
        run: lake exe cache get
      - name: Ban proof placeholders
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' lean/K511ActualBochner.lean; then
            exit 1
          fi
      - name: Compile actual Bochner integral lemmas and print axioms
        run: |
          set -o pipefail
          lake env lean lean/K511ActualBochner.lean 2>&1 | tee k511-compile.log
          if grep -E 'sorryAx|^.*error:' k511-compile.log; then
            echo "Kernel audit failed: compilation error or sorryAx"
            exit 1
          fi
      - name: Compile original 5.11 heat-layer clock transfer
        run: |
          set -o pipefail
          lake env lean lean/Original511EdgeClock.lean 2>&1 | tee k511-clock-compile.log
          if grep -E 'sorryAx|^.*error:' k511-clock-compile.log; then
            echo "Clock theorem not certified"
            exit 1
          fi
      - name: Compile complete original 5.11 spatial-clock integration
        run: |
          set -o pipefail
          lake env lean lean/K511Integrated.lean 2>&1 | tee k511-integrated.log
          if grep -E 'sorryAx|^.*error:' k511-integrated.log; then
            exit 1
          fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k511-bochner-log
          path: |
            k511-compile.log
            k511-clock-compile.log
            k511-integrated.log
