name: Lean Verification

on:
  push:
    branches: ["main", "whole-paper-lean"]
    paths:
      - 'lean/**'
      - 'lean-toolchain'
      - 'lakefile.*'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'lean/**'
      - 'lean-toolchain'
      - 'lakefile.*'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

concurrency:
  group: sm-public-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whole-paper-lean

      - name: Record actual checked revision
        run: |
          echo "CHECKED_SHA=$(git rev-parse HEAD)"
          cat lean-toolchain

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: false

      - name: Resolve Mathlib dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Reject proof placeholders and custom axioms
        run: |
          if grep -R -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' lean --include='*.lean'; then
            echo "Forbidden proof placeholder/custom axiom declaration found"
            exit 1
          fi

      - name: Compile every public Lean file and collect failures
        shell: bash
        run: |
          set -uo pipefail
          status=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            echo "==> $f"
            logfile="${RUNNER_TEMP}/sm-lean-${count}.log"
            if lake env lean "$f" >"$logfile" 2>&1; then
              cat "$logfile"
              echo "COMPILE_OK $f"
            else
              cat "$logfile"
              echo "COMPILE_FAIL $f"
              status=1
            fi
            if grep -q 'sorryAx' "$logfile"; then
              echo "FORBIDDEN_AXIOM_IN_OUTPUT $f"
              status=1
            fi
          done < <(find lean -name '*.lean' -print0 | sort -z)
          echo "CHECKED_FILE_COUNT=$count"
          if [ "$count" -eq 0 ]; then exit 1; fi
          exit "$status"
